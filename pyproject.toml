[project]
name = "cerngitlab-mcp"
version = "0.4.0"
description = "MCP server for CERN GitLab - code discovery, documentation access, and usage examples for HEP projects"
readme = "README.md"
authors = [
    { name = "Mohamed Elashri", email = "mohamed.elashri@cern.ch" }
]
requires-python = ">=3.10"
license = { text = "AGPL-3.0" }
keywords = ["mcp", "gitlab", "cern", "hep", "physics", "lhc", "root", "model-context-protocol"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Physics",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Operating System :: OS Independent",
]
dependencies = [
    "mcp>=2.3.0,<3",
    "httpx>=0.28.1",
    "pydantic>=2.14.2",
    "pydantic-settings>=2.15.0",
    "click>=8.5.0",
    "fastapi>=0.162.0",
    "uvicorn>=0.54.0",
    "PyJWT[crypto]>=2.15.1",
    "aiofiles>=25.1.0",
]

[project.urls]
Homepage = "https://github.com/MohamedElashri/cerngitlab-mcp"
Repository = "https://github.com/MohamedElashri/cerngitlab-mcp"
Issues = "https://github.com/MohamedElashri/cerngitlab-mcp/issues"
Changelog = "https://github.com/MohamedElashri/cerngitlab-mcp/blob/main/docs/CHANGELOG.md"
Icon = "https://raw.githubusercontent.com/MohamedElashri/cerngitlab-mcp/main/icons/icon.svg"

[project.scripts]
cerngitlab-mcp = "cerngitlab_mcp.server:main"
cerngitlab-mcp-stdio = "cerngitlab_mcp.server:main_stdio"
cerngitlab-mcp-http = "cerngitlab_mcp.server:main_http"
cerngitlab-cli = "cerngitlab_mcp.cli.main:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1",
    "pytest-httpx>=0.36.2",
    "httpx>=0.28.1",
    "ruff>=0.17.3",
    "pre-commit>=4.6.2",
    "mypy>=2.4.1",
    "types-aiofiles>=25.1.0.20260518",
]

[tool.pytest.ini_options]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
